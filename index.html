<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تقييم بالنقاط مع LocalStorage</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 320px;
    }

    .score-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #58a6ff;
      margin: 0.8rem 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-add {
      background-color: #238636;
      color: white;
    }

    .btn-add.active {
      background-color: #2ea043;
      box-shadow: 0 0 12px rgba(46, 160, 67, 0.6);
    }

    .btn-reset {
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    .status-tag {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>تقييم المستخدم</h2>
    <div id="score" class="score-display">0</div>

    <div class="btn-group">
      <button id="markBtn" class="btn-add" onclick="toggleScore()">إضافة درجة</button>
      <button class="btn-reset" onclick="resetScore()">إلغاء وتصفير</button>
    </div>

    <div class="status-tag">تُحفظ البيانات تلقائياً في المتصفح</div>
  </div>

  <script>
    // 1. استرجاع البيانات المخزنة مسبقاً أو تعيين قيم افتراضية
    let score = parseInt(localStorage.getItem('savedScore')) || 0;
    let isMarked = localStorage.getItem('savedIsMarked') === 'true';

    const scoreDisplay = document.getElementById('score');
    const markBtn = document.getElementById('markBtn');

    // 2. دالة لتحديث الواجهة وحفظ البيانات في LocalStorage
    function updateUIAndSave() {
      scoreDisplay.textContent = score;

      if (isMarked) {
        markBtn.textContent = 'تم التعليم (1+)';
        markBtn.classList.add('active');
      } else {
        markBtn.textContent = 'إضافة درجة';
        markBtn.classList.remove('active');
      }

      // حفظ القيم في LocalStorage
      localStorage.setItem('savedScore', score);
      localStorage.setItem('savedIsMarked', isMarked);
    }

    // 3. إضافة/إلغاء الدرجة
    function toggleScore() {
      if (!isMarked) {
        score += 1;
        isMarked = true;
      } else {
        score -= 1;
        isMarked = false;
      }
      updateUIAndSave();
    }

    // 4. تصفير البيانات ومسحها من LocalStorage
    function resetScore() {
      score = 0;
      isMarked = false;
      localStorage.removeItem('savedScore');
      localStorage.removeItem('savedIsMarked');
      updateUIAndSave();
    }

    // تشغيل التحديث فور فتح الصفحة لعرض البيانات المحفوظة
    updateUIAndSave();
  </script>

</body>
</html>
