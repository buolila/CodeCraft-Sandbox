<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraft Sandbox | محرر الكود التفاعلي</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #00e676;
      --text-color: #f0f6fc;
      --text-secondary: #8b949e;
      --border-color: #30363d;
      --error-color: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .hero {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    /* قسم المحرر التفاعلي */
    .editor-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 450px;
      overflow: hidden;
    }

    .panel-header {
      background-color: #21262d;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .line-counter {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .line-counter.limit {
      color: var(--error-color);
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      color: #58a6ff;
      border: none;
      padding: 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">&lt;CodeCraft /&gt;</div>
  </header>

  <section class="hero">
    <h1>جرب المحرر التفاعلي</h1>
    <p>اكتب كود HTML/CSS مباشرة وشاهد النتيجة في الوقت الفعلي مع الالتزام بحد الأسطر.</p>
  </section>

  <section class="editor-container">
    <div class="panel">
      <div class="panel-header">
        <span>محرر الكود (HTML/CSS)</span>
        <span id="lineCount" class="line-counter">الأسطر: 5 / 50</span>
      </div>
      <textarea id="codeEditor" spellcheck="false"><h1 style="color: #00e676; text-align: center; margin-top: 20%;">مرحباً بك في CodeCraft!</h1>
<p style="text-align: center; color: #333;">عدّل الكود لرؤية التغييرات مباشرة.</p></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>النتيجة الحية (Live Preview)</span>
      </div>
      <iframe id="preview"></iframe>
    </div>
  </section>

  <footer>
    &copy; 2026 CodeCraft Sandbox - جميع الحقوق محفوظة.
  </footer>

  <script>
    const codeEditor = document.getElementById('codeEditor');
    const preview = document.getElementById('preview');
    const lineCount = document.getElementById('lineCount');
    const maxLines = 50;

    function updatePreview() {
      const code = codeEditor.value;
      
      // تحديث العرض المباشر
      const previewDoc = preview.contentDocument || preview.contentWindow.document;
      previewDoc.open();
      previewDoc.write(code);
      previewDoc.close();

      // حساب عدد الأسطر
      const lines = code.split('\n').length;
      lineCount.textContent = `الأسطر: ${lines} / ${maxLines}`;

      if (lines > maxLines) {
        lineCount.classList.add('limit');
      } else {
        lineCount.classList.remove('limit');
      }
    }

    // الاستماع للتغييرات أثناء الكتابة
    codeEditor.addEventListener('input', updatePreview);

    // التشغيل الأول لتحديث النتيجة فور تحميل الصفحة
    updatePreview();
  </script>

</body>
</html>
