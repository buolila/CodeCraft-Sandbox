<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تقييم بالنقاط</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 300px;
    }

    .score-display {
      font-size: 3rem;
      font-weight: bold;
      color: #58a6ff;
      margin: 1rem 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-add {
      background-color: #238636;
      color: white;
    }

    .btn-add.active {
      background-color: #2ea043;
      box-shadow: 0 0 10px #2ea043;
    }

    .btn-reset {
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>تقييم المستخدم</h2>
    <div id="score" class="score-display">0</div>

    <div class="btn-group">
      <button id="markBtn" class="btn-add" onclick="toggleScore()">إضافة درجة</button>
      <button class="btn-reset" onclick="resetScore()">إلغاء</button>
    </div>
  </div>

  <script>
    let score = 0;
    let isMarked = false;

    const scoreDisplay = document.getElementById('score');
    const markBtn = document.getElementById('markBtn');

    // دالة عند الضغط على الزر الرئيسي
    function toggleScore() {
      if (!isMarked) {
        score += 1; // زيادة درجة
        isMarked = true;
        markBtn.textContent = 'تم التعليم (1+)';
        markBtn.classList.add('active');
      } else {
        score -= 1; // إلغاء الدرجة عند الضغط مرة أخرى
        isMarked = false;
        markBtn.textContent = 'إضافة درجة';
        markBtn.classList.remove('active');
      }
      scoreDisplay.textContent = score;
    }

    // دالة التصفير
    function resetScore() {
      score = 0;
      isMarked = false;
      scoreDisplay.textContent = score;
      markBtn.textContent = 'إضافة درجة';
      markBtn.classList.remove('active');
    }
  </script>

</body>
</html>
